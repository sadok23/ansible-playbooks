- name: "Add jetstack repo"
  ansible.builtin.command: helm repo add jetstack https://charts.jetstack.io
  changed_when: false

- name: "Add rancher-stable repo"
  ansible.builtin.command: helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
  changed_when: false

- name: "Update Helm repos"
  ansible.builtin.command: helm repo update
  changed_when: false

- name: "Install cert-manager"
  ansible.builtin.command: >
    helm upgrade --install cert-manager jetstack/cert-manager
    --namespace cert-manager --create-namespace
    --set installCRDs=true --wait
    --timeout 10m
  changed_when: false

- name: "Wait for ingress-nginx controller to be ready"
  ansible.builtin.command: >
    kubectl wait --for=condition=ready pod
    -l app.kubernetes.io/component=controller
    -n kube-system --timeout=5m
  changed_when: false

- name: "Install Rancher"
  ansible.builtin.command: >
    helm upgrade --install rancher rancher-stable/rancher
    --namespace cattle-system --create-namespace
    --set hostname={{ rancher_hostname }}
    --set bootstrapPassword={{ rancher_bootstrap_pw }}
    --set ingress.tls.source=rancher
    --wait --timeout 10m
  changed_when: false

- name: "Print Rancher URL"
  ansible.builtin.debug:
    msg: "Rancher ({{ distro }}) is ready at: https://{{ rancher_hostname }}"