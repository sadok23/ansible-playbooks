    - name: "Add ArgoCD Helm repo"
      ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
      changed_when: false

    - name: "Update Helm repos"
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: "Create argocd namespace"
      ansible.builtin.command: kubectl create namespace argocd
      register: ns_result
      failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
      changed_when: ns_result.rc == 0

    - name: "Wait for nginx ingress admission webhook to be ready"
      ansible.builtin.command: >
        kubectl rollout status daemonset rke2-ingress-nginx-controller
        -n kube-system --timeout=5m
      changed_when: false

    - name: "Install ArgoCD"
      ansible.builtin.command: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd
        --set server.ingress.enabled=true
        --set server.ingress.hostname={{ argocd_hostname }}
        --set configs.params."server\.insecure"=true
        --wait
        --timeout 10m

    - name: "Fetch ArgoCD initial admin password"
      ansible.builtin.command: >
        kubectl get secret argocd-initial-admin-secret
        -n argocd
        -o jsonpath="{.data.password}"
      register: argocd_password_b64
      changed_when: false

    - name: "Print ArgoCD access info"
      ansible.builtin.debug:
        msg:
          - "ArgoCD ({{ distro }}) is ready at: https://{{ argocd_hostname }}"
          - "Username: admin"
          - "Password: {{ argocd_password_b64.stdout | b64decode }}"